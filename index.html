  <div class="container">
    <div class="box">
      <div class="title">Conteúdo disponível</div>

      <div class="subtitle">
        Continue para acessar o material completo.
      </div>

      <div class="notice">
        Toque abaixo para prosseguir.
      </div>

      <button class="btn" id="goBtn" type="button">
        Acessar agora
      </button>

      <div class="loading" id="loading">
        Redirecionando...
      </div>
    </div>
  </div>

  <script>
    // COLOQUE AQUI O ENDEREÇO DO SEU SITE
    var siteDestino = "https://SEU-SITE.com/";

    // Integração BotBrain
    var urlApi =
      "https://gfakbrdvnfutznhyuvrv.supabase.co/functions/v1/track-external-click";

    var shortCode = "bot-d6112058";
    var redirectLiberado = null;

    // Captura os parâmetros recebidos pela pressel
    var parametrosEntrada = new URLSearchParams(
      window.location.search
    );

    // Consulta a API de rastreamento
    fetch(urlApi, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        shortCode: shortCode,
        queryParams: Object.fromEntries(parametrosEntrada.entries()),
        userAgent: navigator.userAgent,
        urlCompleto: window.location.search.substring(1) || null
      })
    })
    .then(function(resposta) {
      if (!resposta.ok) {
        throw new Error("Falha no rastreamento");
      }
      return resposta.json();
    })
    .then(function(dados) {
      if (dados && dados.redirectUrl) {
        redirectLiberado = dados.redirectUrl;
      }
    })
    .catch(function(erro) {
      console.warn("Rastreamento indisponível:", erro);
    });

    // Redireciona ao clicar, sem depender da resposta da API
    document.getElementById("goBtn").addEventListener("click", function() {
      var botao = this;

      botao.disabled = true;
      botao.textContent = "Redirecionando...";
      document.getElementById("loading").style.display = "block";

      try {
        var destino = new URL(siteDestino);

        // Preserva os parâmetros recebidos pela pressel
        parametrosEntrada.forEach(function(valor, chave) {
          if (!destino.searchParams.has(chave)) {
            destino.searchParams.append(chave, valor);
          }
        });

        window.location.href = destino.href;
      } catch (erro) {
        botao.disabled = false;
        botao.textContent = "Acessar agora";
        document.getElementById("loading").style.display = "none";
        alert("Confira o endereço configurado para o site.");
      }
    });
  </script>
</body>
