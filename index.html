<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdo</title>

  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');

  fbq('init', '1770525424199188');
  fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1770525424199188&ev=PageView&noscript=1"
    alt="">
  </noscript>
  <!-- End Meta Pixel Code -->

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 360px;
    }

    .box {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .title {
      font-size: 20px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 14px;
      color: #cbd5f5;
      margin-bottom: 15px;
    }

    .notice {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      padding: 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 10px 20px rgba(34,197,94,0.3);
      color: #fff;
      border: none;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.8;
      cursor: wait;
    }

    .loading {
      margin-top: 15px;
      font-size: 13px;
      color: #cbd5f5;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box">
      <div class="title">Conteúdo disponível</div>

      <div class="subtitle">
        Continue para acessar o material completo.
      </div>

      <div class="notice">
        Toque abaixo para prosseguir.
      </div>

      <button class="btn" id="goBtn" type="button">
        Acessar agora
      </button>

      <div class="loading" id="loading" aria-live="polite">
        Redirecionando...
      </div>
    </div>
  </div>

  <script>
    // Destino do botão
    var siteDestino =
      "https://pt.wikihow.com/Fazer-La%C3%A7o-de-Fita";

    // Integração BotBrain
    var urlApi =
      "https://gfakbrdvnfutznhyuvrv.supabase.co/functions/v1/track-external-click";

    var shortCode = "bot-d6112058";

    // Captura os parâmetros recebidos na URL
    var parametrosEntrada = new URLSearchParams(
      window.location.search
    );

    // Registra visualização de conteúdo.
    // PageView já é enviado pelo código-base do Pixel.
    if (typeof fbq === "function") {
      fbq("track", "ViewContent");
    }

    // Envia os dados de rastreamento para a BotBrain
    fetch(urlApi, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        shortCode: shortCode,
        queryParams: Object.fromEntries(
          parametrosEntrada.entries()
        ),
        userAgent: navigator.userAgent,
        urlCompleto: window.location.search.substring(1) || null
      })
    })
    .then(function(resposta) {
      if (!resposta.ok) {
        throw new Error("Falha no rastreamento");
      }

      return resposta.json();
    })
    .catch(function(erro) {
      console.warn("Rastreamento BotBrain:", erro);
    });

    // Clique e redirecionamento
    document.getElementById("goBtn").addEventListener(
      "click",
      function() {
        var botao = this;

        if (botao.disabled) return;

        botao.disabled = true;
        botao.textContent = "Redirecionando...";

        document.getElementById("loading").style.display = "block";

        // Evento personalizado: clique no botão
        if (typeof fbq === "function") {
          fbq("trackCustom", "CliqueAcessarAgora");
        }

        try {
          var destino = new URL(siteDestino);

          // Preserva UTMs e outros parâmetros da URL de entrada
          parametrosEntrada.forEach(function(valor, chave) {
            if (!destino.searchParams.has(chave)) {
              destino.searchParams.append(chave, valor);
            }
          });

          window.location.href = destino.href;

        } catch (erro) {
          botao.disabled = false;
          botao.textContent = "Acessar agora";

          document.getElementById("loading").style.display = "none";

          console.error("Erro no redirecionamento:", erro);
          alert("Confira o endereço configurado para o site.");
        }
      }
    );
  </script>
</body>
</html>
